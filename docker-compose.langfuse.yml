x-langfuse-worker-env: &langfuse-worker-env
  NEXTAUTH_URL: http://localhost:3002
  DATABASE_URL: postgresql://langfuse:langfuse-ci-only@langfuse-postgres:5432/langfuse
  SALT: opssentinel-phase9-langfuse-ci-salt
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  LANGFUSE_MIGRATION_V4_NATIVE_OTEL_BEHAVIOUR: direct
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: langfuse-ci-only
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: langfuse-ci-only
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: langfuse-ci-only
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: langfuse-ci-only
  REDIS_TLS_ENABLED: "false"

services:
  backend:
    environment:
      OPSSENTINEL_LANGFUSE_ENABLED: "true"
      OPSSENTINEL_LANGFUSE_HOST: http://langfuse-web:3000
      OPSSENTINEL_LANGFUSE_PUBLIC_KEY: pk-lf-opssentinel-phase9-ci
      OPSSENTINEL_LANGFUSE_SECRET_KEY: sk-lf-opssentinel-phase9-ci
    depends_on:
      langfuse-web:
        condition: service_started

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment: *langfuse-worker-env
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:3032:3030"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: opssentinel-phase9-langfuse-nextauth-ci-only
      LANGFUSE_INIT_ORG_ID: opssentinel
      LANGFUSE_INIT_ORG_NAME: OpsSentinel
      LANGFUSE_INIT_PROJECT_ID: opssentinel-phase9
      LANGFUSE_INIT_PROJECT_NAME: OpsSentinel Phase 9
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-opssentinel-phase9-ci
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-opssentinel-phase9-ci
      LANGFUSE_INIT_USER_EMAIL: opssentinel@example.invalid
      LANGFUSE_INIT_USER_NAME: OpsSentinel CI
      LANGFUSE_INIT_USER_PASSWORD: opssentinel-phase9-ci-password
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:9092
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "3002:3000"

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse-ci-only
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: langfuse-ci-only
    ports:
      - "127.0.0.1:9092:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s

  langfuse-redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "langfuse-ci-only", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuse-ci-only", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15

  langfuse-postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse-ci-only
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
