name: opssentinel

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opssentinel
      POSTGRES_USER: opssentinel
      POSTGRES_PASSWORD: opssentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opssentinel -d opssentinel"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      OPSSENTINEL_ENVIRONMENT: development
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@postgres:5432/opssentinel
      OPSSENTINEL_REDIS_URL: redis://redis:6379/0
      OPSSENTINEL_LLM_PROVIDER: local
      OPSSENTINEL_LLM_MODEL: local-placeholder
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
