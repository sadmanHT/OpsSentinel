name: opssentinel

# Local research/development stack. Host ports are loopback-bound deliberately;
# this Compose file is not an Internet-facing production deployment.

x-chaoslab-service: &chaoslab-service
  build:
    context: ./chaoslab
  environment: &chaoslab-env
    CHAOSLAB_REDIS_URL: redis://redis:6379/1
    CHAOSLAB_DATABASE_URL: postgresql://opssentinel:opssentinel@postgres:5432/opssentinel
    CHAOSLAB_SEED: 42
    CHAOSLAB_OTEL_ENABLED: ${CHAOSLAB_OTEL_ENABLED:-false}
    CHAOSLAB_OTEL_EXPORTER_OTLP_ENDPOINT: ${CHAOSLAB_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 15

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: opssentinel
      POSTGRES_USER: opssentinel
      POSTGRES_PASSWORD: opssentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opssentinel -d opssentinel"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-opssentinel}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-opssentinel}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_started

  backend:
    build:
      context: ./backend
    environment:
      OPSSENTINEL_ENVIRONMENT: development
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@postgres:5432/opssentinel
      OPSSENTINEL_REDIS_URL: redis://redis:6379/0
      OPSSENTINEL_LLM_PROVIDER: local
      OPSSENTINEL_LLM_MODEL: local-placeholder
      OPSSENTINEL_AGENT_ARCHITECTURE: ${OPSSENTINEL_AGENT_ARCHITECTURE:-explicit_planner}
      OPSSENTINEL_TEMPORAL_REASONING: ${OPSSENTINEL_TEMPORAL_REASONING:-standard}
      OPSSENTINEL_TOOL_ORDER: ${OPSSENTINEL_TOOL_ORDER:-free}
      OPSSENTINEL_TOOL_ORDER_CONTROLLED: ${OPSSENTINEL_TOOL_ORDER_CONTROLLED:-false}
      OPSSENTINEL_EVIDENCE_MODE: ${OPSSENTINEL_EVIDENCE_MODE:-passive_only}
      OPSSENTINEL_RETRIEVAL_DEPTH: ${OPSSENTINEL_RETRIEVAL_DEPTH:-20}
      OPSSENTINEL_RETRIEVAL_DEPTH_CONTROLLED: ${OPSSENTINEL_RETRIEVAL_DEPTH_CONTROLLED:-false}
      OPSSENTINEL_STOPPING_STRATEGY: ${OPSSENTINEL_STOPPING_STRATEGY:-confidence_threshold}
      OPSSENTINEL_COMPOUND_EVIDENCE_PLAN: ${OPSSENTINEL_COMPOUND_EVIDENCE_PLAN:-false}
      OPSSENTINEL_OTEL_ENABLED: ${OPSSENTINEL_OTEL_ENABLED:-false}
      OPSSENTINEL_OTEL_SERVICE_NAME: ${OPSSENTINEL_OTEL_SERVICE_NAME:-opssentinel-backend}
      OPSSENTINEL_OTEL_EXPORTER_OTLP_ENDPOINT: ${OPSSENTINEL_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OPSSENTINEL_MCP_DATABASE_URL: postgresql://opssentinel_reader:opssentinel_readonly@postgres:5432/opssentinel
      OPSSENTINEL_MCP_REPO_ROOT: /workspace
      OPSSENTINEL_MCP_DOCS_ROOT: /workspace/docs
      OPSSENTINEL_MCP_BACKEND_URL: http://backend:8000
      OPSSENTINEL_MCP_GATEWAY_URL: http://gateway:8080
      OPSSENTINEL_MCP_CHECKOUT_URL: http://checkout:8080
      OPSSENTINEL_MCP_INVENTORY_URL: http://inventory:8080
      OPSSENTINEL_MCP_PAYMENT_URL: http://payment:8080
      OPSSENTINEL_MCP_WORKER_URL: http://worker:8080
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  chaoslab-controller:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: controller
    command: ["uvicorn", "chaoslab.controller:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8100:8080"

  checkout:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: checkout
    ports:
      - "127.0.0.1:8101:8080"

  inventory:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: inventory
    ports:
      - "127.0.0.1:8102:8080"

  payment:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: payment
    ports:
      - "127.0.0.1:8103:8080"

  worker:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: worker
    ports:
      - "127.0.0.1:8104:8080"

  gateway:
    <<: *chaoslab-service
    environment:
      <<: *chaoslab-env
      CHAOSLAB_SERVICE_NAME: gateway
      CHAOSLAB_CHECKOUT_URL: http://checkout:8080
      CHAOSLAB_INVENTORY_URL: http://inventory:8080
      CHAOSLAB_PAYMENT_URL: http://payment:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      checkout:
        condition: service_healthy
      payment:
        condition: service_healthy
      inventory:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
