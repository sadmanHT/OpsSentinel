name: Phase 8 Tool Order

on:
  push:
    branches:
      - phase-8-controlled-research
  pull_request:
    paths:
      - "backend/app/agent/**"
      - "backend/app/config.py"
      - "backend/tests/test_phase8_tool_order.py"
      - "benchmarklab/**"
      - "evaluationlab/**"
      - "researchlab/**"
      - "scripts/phase8-tool-order-*.py"
      - "docker-compose.yml"
      - ".github/workflows/phase8-tool-order.yml"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tool Order engineering runtimes
        run: |
          python -m pip install -e 'backend[dev]'
          python -m pip install -e 'benchmarklab[dev]'
          python -m pip install -e 'evaluationlab[dev]'
          python -m pip install -e 'researchlab[dev]'

      - name: Ruff Tool Order implementation
        run: |
          ruff check \
            backend/app/agent/tool_order.py \
            backend/app/agent/service.py \
            backend/app/agent/api.py \
            backend/tests/test_phase8_tool_order.py \
            researchlab/researchlab/live_executor.py \
            researchlab/researchlab/tool_order.py \
            researchlab/tests/test_live_executor.py \
            researchlab/tests/test_tool_order.py \
            scripts/phase8-tool-order-arm.py \
            scripts/phase8-tool-order-report.py

      - name: Strict backend typing
        working-directory: backend
        run: mypy app

      - name: Strict ResearchLab typing
        run: mypy --config-file researchlab/pyproject.toml researchlab/researchlab

      - name: Tool Order unit and isolation tests
        run: |
          pytest backend/tests/test_phase8_tool_order.py
          pytest researchlab/tests/test_live_executor.py researchlab/tests/test_tool_order.py

  tool-order-arm:
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool_order:
          - free
          - deployment_first
          - symptom_first
          - adaptive
    env:
      OPSSENTINEL_AGENT_ARCHITECTURE: explicit_planner
      OPSSENTINEL_TEMPORAL_REASONING: standard
      OPSSENTINEL_TOOL_ORDER: ${{ matrix.tool_order }}
      OPSSENTINEL_TOOL_ORDER_CONTROLLED: "true"
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@127.0.0.1:5432/opssentinel
      PHASE8_TOOL_ORDER: ${{ matrix.tool_order }}
      PHASE8_TOOL_ORDER_ARM_OUTPUT: phase8-tool-order-${{ matrix.tool_order }}.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live research runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e evaluationlab
          python -m pip install -e 'researchlab[dev]'

      - name: Start clean Tool Order treatment stack
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build \
            postgres redis backend chaoslab-controller \
            checkout inventory payment worker gateway

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/agent/health >/tmp/tool-order-health.json \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          health = json.loads(Path('/tmp/tool-order-health.json').read_text())
          expected = os.environ['OPSSENTINEL_TOOL_ORDER']
          assert health['tool_order'] == expected, (health, expected)
          assert health['tool_order_controlled'] is True, health
          assert health['temporal_reasoning'] == 'standard', health
          assert 'tool-order-controlled-v1' in health['provider'], health
          assert 'temporal-cause-effect-v1' not in health['provider'], health
          PY

      - name: Execute ten-scenario Tool Order treatment arm
        run: python scripts/phase8-tool-order-arm.py

      - name: Retain Tool Order raw trajectories
        uses: actions/upload-artifact@v7
        with:
          name: phase8-tool-order-${{ matrix.tool_order }}
          path: phase8-tool-order-${{ matrix.tool_order }}.json
          if-no-files-found: error

      - name: Verify clean restoration and logs
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
          docker compose logs backend --no-color > /tmp/opssentinel-tool-order-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway \
            --no-color > /tmp/opssentinel-tool-order-chaoslab.log
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-tool-order-backend.log; then
            echo "Unexpected critical backend log output detected"
            exit 1
          fi
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-tool-order-chaoslab.log; then
            echo "Unexpected critical ChaosLab log output detected"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

  tool-order-report:
    needs: tool-order-arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e researchlab

      - name: Download Tool Order arms
        uses: actions/download-artifact@v4
        with:
          pattern: phase8-tool-order-*
          path: phase8-tool-order-arms
          merge-multiple: true

      - name: Build descriptive Tool Order report
        run: |
          python scripts/phase8-tool-order-report.py \
            --output phase8-tool-order-report.json \
            phase8-tool-order-arms/phase8-tool-order-free.json \
            phase8-tool-order-arms/phase8-tool-order-deployment_first.json \
            phase8-tool-order-arms/phase8-tool-order-symptom_first.json \
            phase8-tool-order-arms/phase8-tool-order-adaptive.json

      - name: Retain complete Tool Order research artifact
        uses: actions/upload-artifact@v7
        with:
          name: phase8-tool-order-report
          path: |
            phase8-tool-order-report.json
            phase8-tool-order-arms/*.json
          if-no-files-found: error
