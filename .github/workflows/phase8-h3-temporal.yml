name: Phase 8 H3 Temporal Reasoning

on:
  push:
    branches:
      - phase-8-controlled-research
  pull_request:
    paths:
      - "backend/app/agent/**"
      - "backend/app/config.py"
      - "backend/tests/test_phase8_temporal_reasoning.py"
      - "benchmarklab/**"
      - "evaluationlab/**"
      - "researchlab/**"
      - "scripts/phase8-temporal-reasoning-*.py"
      - "docker-compose.yml"
      - ".github/workflows/phase8-h3-temporal.yml"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install H3 engineering runtimes
        run: |
          python -m pip install -e 'backend[dev]'
          python -m pip install -e 'benchmarklab[dev]'
          python -m pip install -e 'evaluationlab[dev]'
          python -m pip install -e 'researchlab[dev]'

      - name: Ruff H3 implementation
        run: |
          ruff check \
            backend/app/agent/temporal.py \
            backend/app/agent/service.py \
            backend/app/agent/api.py \
            backend/tests/test_phase8_temporal_reasoning.py \
            researchlab/researchlab/live_executor.py \
            researchlab/researchlab/temporal_reasoning.py \
            researchlab/tests/test_live_executor.py \
            researchlab/tests/test_temporal_reasoning.py \
            scripts/phase8-temporal-reasoning-arm.py \
            scripts/phase8-temporal-reasoning-report.py

      - name: Strict backend typing
        working-directory: backend
        run: mypy app

      - name: Strict ResearchLab typing
        run: mypy --config-file researchlab/pyproject.toml researchlab/researchlab

      - name: H3 unit and isolation tests
        run: |
          pytest backend/tests/test_phase8_temporal_reasoning.py
          pytest researchlab/tests/test_live_executor.py researchlab/tests/test_temporal_reasoning.py

  temporal-arm:
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        temporal:
          - standard
          - explicit_cause_effect
    env:
      OPSSENTINEL_AGENT_ARCHITECTURE: explicit_planner
      OPSSENTINEL_TEMPORAL_REASONING: ${{ matrix.temporal }}
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@127.0.0.1:5432/opssentinel
      PHASE8_H3_TEMPORAL: ${{ matrix.temporal }}
      PHASE8_H3_ARM_OUTPUT: phase8-h3-${{ matrix.temporal }}.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live research runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e evaluationlab
          python -m pip install -e 'researchlab[dev]'

      - name: Start clean H3 treatment stack
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build \
            postgres redis backend chaoslab-controller \
            checkout inventory payment worker gateway

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/agent/health >/tmp/h3-health.json \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          health = json.loads(Path('/tmp/h3-health.json').read_text())
          expected = os.environ['OPSSENTINEL_TEMPORAL_REASONING']
          assert health['temporal_reasoning'] == expected, (health, expected)
          if expected == 'explicit_cause_effect':
              assert 'temporal-cause-effect-v1' in health['provider']
          else:
              assert 'temporal-cause-effect-v1' not in health['provider']
          PY

      - name: Execute five-scenario H3 treatment arm
        run: python scripts/phase8-temporal-reasoning-arm.py

      - name: Retain H3 raw trajectories
        uses: actions/upload-artifact@v4
        with:
          name: phase8-h3-${{ matrix.temporal }}
          path: phase8-h3-${{ matrix.temporal }}.json
          if-no-files-found: error

      - name: Verify clean restoration and logs
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
          docker compose logs backend --no-color > /tmp/opssentinel-h3-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway \
            --no-color > /tmp/opssentinel-h3-chaoslab.log
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-h3-backend.log; then
            echo "Unexpected critical backend log output detected"
            exit 1
          fi
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-h3-chaoslab.log; then
            echo "Unexpected critical ChaosLab log output detected"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

  temporal-report:
    needs: temporal-arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e researchlab

      - name: Download H3 arms
        uses: actions/download-artifact@v4
        with:
          pattern: phase8-h3-*
          path: phase8-h3-arms
          merge-multiple: true

      - name: Build descriptive H3 paired report
        run: |
          python scripts/phase8-temporal-reasoning-report.py \
            --output phase8-h3-report.json \
            phase8-h3-arms/phase8-h3-standard.json \
            phase8-h3-arms/phase8-h3-explicit_cause_effect.json

      - name: Retain complete H3 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase8-h3-temporal-reasoning-report
          path: |
            phase8-h3-report.json
            phase8-h3-arms/*.json
          if-no-files-found: error
