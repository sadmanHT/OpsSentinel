name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opssentinel_test
          POSTGRES_USER: opssentinel
          POSTGRES_PASSWORD: opssentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opssentinel -d opssentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OPSSENTINEL_ENVIRONMENT: test
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@localhost:5432/opssentinel_test
      OPSSENTINEL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e 'backend[dev]'
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy backend/app
      - name: Unit tests
        run: pytest backend/tests -m 'not integration'
      - name: Backend import/startup smoke test
        run: python -c "from app.main import app; assert app.title == 'OpsSentinel API'"
        working-directory: backend
      - name: Migration upgrade
        run: alembic upgrade head
        working-directory: backend
      - name: Integration tests
        run: pytest tests -m integration
        working-directory: backend
      - name: Migration rollback and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.test.yml config >/dev/null
      - name: Build images
        run: docker compose build
      - name: Clean-state integration smoke test
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build

          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Backend did not become healthy"
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          curl --fail --show-error http://127.0.0.1:8000/health
          docker compose exec -T postgres psql -U opssentinel -d opssentinel \
            -c "SELECT to_regclass('public.incidents') AS incidents_table;" \
            | grep incidents
          docker compose ps

          docker compose logs backend --no-color > /tmp/opssentinel-backend.log
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-backend.log; then
            echo "Unexpected critical backend log output detected"
            cat /tmp/opssentinel-backend.log
            exit 1
          fi
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down clean-state environment
        if: always()
        run: docker compose down -v --remove-orphans || true
