name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opssentinel_test
          POSTGRES_USER: opssentinel
          POSTGRES_PASSWORD: opssentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opssentinel -d opssentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      OPSSENTINEL_ENVIRONMENT: test
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@localhost:5432/opssentinel_test
      OPSSENTINEL_MCP_DATABASE_URL: postgresql://opssentinel_reader:opssentinel_readonly@localhost:5432/opssentinel_test
      OPSSENTINEL_REDIS_URL: redis://localhost:6379/0
      OPSSENTINEL_LLM_PROVIDER: deterministic
      OPSSENTINEL_MCP_REPO_ROOT: ${{ github.workspace }}
      OPSSENTINEL_MCP_DOCS_ROOT: ${{ github.workspace }}/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e 'backend[dev]'
      - name: Ruff
        run: ruff check backend
      - name: Mypy
        run: mypy backend/app
      - name: Unit tests
        run: pytest backend/tests -m 'not integration'
      - name: Backend, MCP, and agent import/startup smoke test
        working-directory: backend
        run: |
          python -c "from app.main import app; assert app.title == 'OpsSentinel API'; assert app.version == '0.3.0'"
          python -c "from app.mcp.registry import build_registry; assert len(build_registry().definitions()) == 16"
          python -c "from app.agent.runtime import AgentRuntime; assert AgentRuntime.architecture_version == 'phase4-single-agent-v1'"
          python -c "from app.agent.phase5_runtime import Phase5Runtime; assert Phase5Runtime.architecture_version == 'phase5-safe-operational-agent-v1'"
      - name: Migration upgrade
        run: alembic upgrade head
        working-directory: backend
      - name: Integration tests
        run: pytest tests -m integration
        working-directory: backend
      - name: Migration rollback and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
        working-directory: backend

  chaoslab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chaoslab/pyproject.toml
      - name: Install ChaosLab
        run: python -m pip install -e 'chaoslab[dev]'
      - name: Ruff
        run: ruff check chaoslab
      - name: Unit tests
        run: pytest chaoslab/tests
      - name: Import smoke tests
        working-directory: chaoslab
        run: |
          python -c "from chaoslab import ChaosLabClient; assert ChaosLabClient"
          python -c "from chaoslab.models import FaultSpec, FaultType; assert FaultSpec(fault=FaultType.N_PLUS_ONE, service='checkout').seed == 42"
          python -c "from chaoslab.loadgen import PROFILES; assert {'normal','burst','sustained'} <= set(PROFILES)"

  benchmarklab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: benchmarklab/pyproject.toml
      - name: Install BenchmarkLab
        run: python -m pip install -e 'benchmarklab[dev]'
      - name: Ruff
        run: ruff check benchmarklab scripts/phase6-benchmark-smoke.py
      - name: Mypy
        run: mypy benchmarklab/benchmarklab
      - name: Unit and integrity tests
        run: pytest benchmarklab/tests
      - name: Catalog smoke
        working-directory: benchmarklab
        run: |
          python - <<'PY'
          from collections import Counter
          from benchmarklab import load_catalog
          from benchmarklab.models import Difficulty

          catalog = load_catalog()
          assert len(catalog.scenarios) == 50
          assert Counter(item.difficulty for item in catalog.scenarios) == {
              Difficulty.EASY: 10,
              Difficulty.MEDIUM: 12,
              Difficulty.HARD: 12,
              Difficulty.ADVERSARIAL: 8,
              Difficulty.COMPOUND: 8,
          }
          print(catalog.benchmark_version, len(catalog.scenarios))
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            benchmarklab/pyproject.toml
            evaluationlab/pyproject.toml
      - name: Install benchmark and evaluation runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e evaluationlab
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.test.yml config >/dev/null
      - name: Build images
        run: docker compose build
      - name: Clean-state cumulative integration gate
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/mcp/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/agent/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Cumulative environment did not become healthy"
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8000/mcp/health
          curl --fail --show-error http://127.0.0.1:8000/agent/health
          docker compose exec -T postgres psql -U opssentinel -d opssentinel \
            -c "SELECT to_regclass('public.incidents') AS incidents_table, to_regclass('public.agent_checkpoints') AS checkpoint_table;" \
            | grep agent_checkpoints

          python scripts/phase2-smoke.py
          python scripts/phase3-mcp-smoke.py
          python scripts/phase4-agent-smoke.py
          python scripts/phase5-operational-smoke.py
          python scripts/phase5-approval-negative-smoke.py
          python scripts/phase5-rejected-matrix-smoke.py
          python scripts/phase6-benchmark-smoke.py
          python scripts/phase7-evaluation-smoke.py

          checkpoint_count=$(docker compose exec -T postgres psql -U opssentinel -d opssentinel -tAc \
            "SELECT COUNT(*) FROM agent_checkpoints;")
          diagnosis_count=$(docker compose exec -T postgres psql -U opssentinel -d opssentinel -tAc \
            "SELECT COUNT(*) FROM diagnoses;")
          evaluation_run_count=$(docker compose exec -T postgres psql -U opssentinel -d opssentinel -tAc \
            "SELECT COUNT(*) FROM evaluation_runs;")
          evaluation_score_count=$(docker compose exec -T postgres psql -U opssentinel -d opssentinel -tAc \
            "SELECT COUNT(*) FROM evaluation_scores;")
          experiment_count=$(docker compose exec -T postgres psql -U opssentinel -d opssentinel -tAc \
            "SELECT COUNT(*) FROM experiment_metadata;")
          test "$checkpoint_count" -ge 18
          test "$diagnosis_count" -ge 18
          test "$evaluation_run_count" -ge 1
          test "$evaluation_score_count" -ge 1
          test "$experiment_count" -ge 1

          docker compose exec -T gateway python - <<'PY'
          import asyncio
          from chaoslab.loadgen import run_profile

          result = asyncio.run(run_profile("http://gateway:8080", "normal", "/checkout"))
          assert result["requests"] == 20, result
          assert result["errors"] == 0, result
          print(result)
          PY

          curl --fail --silent http://127.0.0.1:8101/metrics | grep chaoslab_db_queries_last_request
          curl --fail --silent http://127.0.0.1:8102/metrics | grep chaoslab_simulated_db_connections
          curl --fail --silent http://127.0.0.1:8000/mcp/tools | grep search_logs
          curl --fail --silent http://127.0.0.1:8000/agent/health | grep phase5-safe-operational-agent-v1
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'

          docker compose ps
          docker compose logs backend --no-color > /tmp/opssentinel-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway --no-color \
            > /tmp/opssentinel-chaoslab.log

          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-backend.log; then
            echo "Unexpected critical backend log output detected"
            cat /tmp/opssentinel-backend.log
            exit 1
          fi

          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-chaoslab.log; then
            echo "Unexpected critical ChaosLab log output detected"
            cat /tmp/opssentinel-chaoslab.log
            exit 1
          fi
      - name: Restart cleanup regression
        run: |
          set -euo pipefail

          curl --fail --silent -X POST http://127.0.0.1:8100/faults/inject \
            -H 'Content-Type: application/json' \
            -d '{"fault":"memory_leak","service":"worker","severity":"P3","seed":42,"configuration":{"chunk_bytes":262144,"max_bytes":1048576}}' >/dev/null
          curl --fail --silent -X POST http://127.0.0.1:8100/faults/inject \
            -H 'Content-Type: application/json' \
            -d '{"fault":"connection_leak","service":"inventory","severity":"P3","seed":42,"configuration":{"capacity":4}}' >/dev/null

          curl --fail --silent -X POST http://127.0.0.1:8104/work >/dev/null
          curl --fail --silent http://127.0.0.1:8102/inventory/SKU-RED >/dev/null

          python - <<'PY'
          import json
          import urllib.request

          def read(url):
              with urllib.request.urlopen(url, timeout=5) as response:
                  return json.load(response)

          assert read("http://127.0.0.1:8104/telemetry")["simulated_memory_leak_bytes"] > 0
          assert read("http://127.0.0.1:8102/telemetry")["simulated_db_connections"] > 0
          assert len(read("http://127.0.0.1:8100/faults")) == 2
          PY

          docker compose restart worker inventory

          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8104/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1

          python - <<'PY'
          import json
          import urllib.request

          def read(url):
              with urllib.request.urlopen(url, timeout=5) as response:
                  return json.load(response)

          assert read("http://127.0.0.1:8104/telemetry")["simulated_memory_leak_bytes"] == 0
          assert read("http://127.0.0.1:8102/telemetry")["simulated_db_connections"] == 0
          faults = read("http://127.0.0.1:8100/faults")
          assert {(item["fault"], item["service"]) for item in faults} == {
              ("memory_leak", "worker"),
              ("connection_leak", "inventory"),
          }
          PY

          curl --fail --silent -X POST http://127.0.0.1:8100/faults/restore-all \
            -H 'Content-Type: application/json' -d '{}' >/dev/null
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down clean-state environment
        if: always()
        run: docker compose down -v --remove-orphans || true
