name: Phase 7 EvaluationLab

on:
  push:
    branches: [phase-7-evaluation-engine]
  pull_request:
    branches: [main]

jobs:
  evaluationlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evaluationlab/pyproject.toml
      - name: Install EvaluationLab
        run: python -m pip install -e 'evaluationlab[dev]'
      - name: Ruff
        run: ruff check evaluationlab
      - name: Mypy
        run: mypy evaluationlab/evaluationlab
      - name: Known-answer metric tests
        run: pytest evaluationlab/tests
      - name: Determinism smoke
        working-directory: evaluationlab
        run: |
          python - <<'PY'
          from evaluationlab import EvaluationCase, EvaluationEngine

          case = EvaluationCase(
              benchmark_version='1.0.0',
              scenario_id='ci-determinism',
              expected_primary_root_cause_code='n_plus_one_query',
              predicted_primary_root_cause_code='N_PLUS_ONE',
              confidence=1.0,
              selected_evidence_tags=['metric:db_queries'],
              relevant_evidence_tags=['metric:db_queries'],
              critical_evidence_tags=['metric:db_queries'],
          )
          engine = EvaluationEngine()
          assert engine.evaluate(case).model_dump() == engine.evaluate(case).model_dump()
          PY

  persistence:
    needs: evaluationlab
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opssentinel_test
          POSTGRES_USER: opssentinel
          POSTGRES_PASSWORD: opssentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opssentinel -d opssentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPSSENTINEL_ENVIRONMENT: test
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@localhost:5432/opssentinel_test
      OPSSENTINEL_MCP_DATABASE_URL: postgresql://opssentinel:opssentinel@localhost:5432/opssentinel_test
      OPSSENTINEL_REDIS_URL: redis://localhost:6379/0
      OPSSENTINEL_LLM_PROVIDER: deterministic
      OPSSENTINEL_MCP_REPO_ROOT: ${{ github.workspace }}
      OPSSENTINEL_MCP_DOCS_ROOT: ${{ github.workspace }}/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            evaluationlab/pyproject.toml
      - name: Install backend and EvaluationLab
        run: |
          python -m pip install -e 'backend[dev]'
          python -m pip install -e 'evaluationlab[dev]'
      - name: Apply migrations from zero
        working-directory: backend
        run: alembic upgrade head
      - name: PostgreSQL persistence and restart readback
        run: pytest evaluationlab/integration/test_postgres_persistence.py
      - name: Migration rollback and re-upgrade
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head
