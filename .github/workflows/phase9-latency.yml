name: Phase 9 Latency

on:
  push:
    branches:
      - phase-9-cost-observability-ui
  pull_request:
    paths:
      - "backend/app/observability/**"
      - "backend/app/agent/**"
      - "backend/tests/test_phase9_cost_tracking.py"
      - "backend/tests/test_phase9_latency.py"
      - "scripts/phase9-latency-smoke.py"
      - "docker-compose.yml"
      - ".github/workflows/phase9-latency.yml"

jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opssentinel_test
          POSTGRES_USER: opssentinel
          POSTGRES_PASSWORD: opssentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opssentinel -d opssentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OPSSENTINEL_ENVIRONMENT: test
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@localhost:5432/opssentinel_test
      OPSSENTINEL_LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install latency engineering runtime
        run: python -m pip install -e 'backend[dev]'

      - name: Ruff Phase 9 latency implementation
        run: |
          ruff check \
            backend/app/observability/models.py \
            backend/app/observability/store.py \
            backend/app/observability/api.py \
            backend/tests/test_phase9_cost_tracking.py \
            backend/tests/test_phase9_latency.py \
            scripts/phase9-latency-smoke.py

      - name: Strict backend typing
        working-directory: backend
        run: mypy app

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Phase 9 latency unit and PostgreSQL integration tests
        run: |
          pytest backend/tests/test_phase9_cost_tracking.py -m 'not integration'
          pytest backend/tests/test_phase9_cost_tracking.py backend/tests/test_phase9_latency.py -m integration

  live-operational-latency:
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start clean operational latency stack
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build \
            postgres redis backend chaoslab-controller \
            checkout inventory payment worker gateway

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/agent/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/observability/latency >/dev/null \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

      - name: Execute approved and rejected operational latency paths
        run: python scripts/phase9-latency-smoke.py

      - name: Retain live latency artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase9-latency-live
          path: phase9-latency-live.json
          if-no-files-found: error

      - name: Verify clean restoration and logs
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
          docker compose logs backend --no-color > /tmp/opssentinel-phase9-latency-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway \
            --no-color > /tmp/opssentinel-phase9-latency-chaoslab.log
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-phase9-latency-backend.log; then
            echo "Unexpected critical backend log output detected"
            exit 1
          fi
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-phase9-latency-chaoslab.log; then
            echo "Unexpected critical ChaosLab log output detected"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
