name: Phase 7 Ruff Diff

on:
  push:
    branches: [phase-7-evaluation-engine]

jobs:
  ruff-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.6'
      - name: Show exact Ruff import fix
        run: ruff check evaluationlab/evaluationlab/metrics.py --fix --diff || true
