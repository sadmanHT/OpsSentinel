name: Phase 4 Strict Mypy Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.head_ref == 'phase-4-autonomous-agent' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend tooling
        run: python -m pip install -e 'backend[dev]'
      - name: Apply exact strict-mypy fixes
        run: python scripts/phase4-mypy-fix.py
      - name: Verify Ruff
        run: ruff check backend
      - name: Verify strict mypy
        run: mypy backend/app
      - name: Verify Phase 4 unit tests
        run: pytest backend/tests -m 'not integration'
      - name: Commit strict typing fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/agent/store.py backend/app/agent/providers.py backend/app/agent/runtime.py
          if git diff --cached --quiet; then
            echo 'No strict-mypy fixes to commit'
            exit 0
          fi
          git commit -m 'Fix Phase 4 strict typing'
          git push origin HEAD:${{ github.head_ref }}
