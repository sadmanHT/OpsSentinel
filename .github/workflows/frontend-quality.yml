name: Frontend Quality

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Static TypeScript check
        working-directory: frontend
        run: npm run check
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: frontend
        env:
          OPSSENTINEL_INCIDENT_CONSOLE_ARTIFACT: /tmp/opssentinel-incident-console-browser.json
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/opssentinel-frontend.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/opssentinel-frontend.log
            exit 1
          fi

          npm run test:browser
          cat /tmp/opssentinel-incident-console-browser.json
