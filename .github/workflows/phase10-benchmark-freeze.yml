name: Phase 10 Benchmark Freeze

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-10-final-validation-release, main]

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            benchmarklab/pyproject.toml
            evaluationlab/pyproject.toml
      - name: Install benchmark and evaluation runtimes
        run: python -m pip install -e 'benchmarklab[dev]' -e 'evaluationlab[dev]'
      - name: Ruff
        run: ruff check benchmarklab evaluationlab scripts/phase10-freeze-verify.py
      - name: Mypy
        run: mypy benchmarklab/benchmarklab evaluationlab/evaluationlab
      - name: Unit and integrity tests
        run: pytest benchmarklab/tests evaluationlab/tests
      - name: Verify frozen v1.0 contract
        run: python scripts/phase10-freeze-verify.py
