name: Phase 9 Incident Console

on:
  push:
    branches:
      - phase-9-cost-observability-ui
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/phase9-incident-console.yml"
      - "docs/phase-10-handoff.md"

jobs:
  incident-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and production build
        run: npm run build

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start frontend development server
        run: |
          set -euo pipefail
          npm run dev -- --port 5173 > /tmp/opssentinel-phase9-console-vite.log 2>&1 &
          echo $! > /tmp/opssentinel-phase9-console-vite.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/opssentinel-phase9-console-vite.log
            exit 1
          fi

      - name: Verify Incident Console browser states and capture portfolio screenshot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/phase9-incident-console-proof.mjs")
          text = path.read_text(encoding="utf-8")
          needle = "  assertIncludes(diagnosisText, 'Inventory retry amplification', 'compound diagnosis')\n\n"
          replacement = needle + "  await page.screenshot({ path: 'phase9-incident-console.png', fullPage: true })\n\n"
          if needle not in text:
              raise SystemExit("incident screenshot insertion point not found")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY
          node scripts/phase9-incident-console-proof.mjs

      - name: Retain browser-state proof and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: phase9-incident-console-browser
          path: |
            frontend/phase9-incident-console-browser.json
            frontend/phase9-incident-console.png
          if-no-files-found: error

      - name: Frontend diagnostics
        if: failure()
        run: cat /tmp/opssentinel-phase9-console-vite.log || true

      - name: Stop frontend development server
        if: always()
        run: |
          if [ -f /tmp/opssentinel-phase9-console-vite.pid ]; then
            kill "$(cat /tmp/opssentinel-phase9-console-vite.pid)" || true
          fi
