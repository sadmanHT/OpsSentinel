name: Phase 9 Experiment Dashboard

on:
  push:
    branches:
      - phase-9-cost-observability-ui
  pull_request:
    paths:
      - "backend/app/observability/api.py"
      - "backend/app/observability/experiments.py"
      - "backend/app/persistence/models.py"
      - "backend/tests/test_phase9_experiment_dashboard.py"
      - "frontend/src/ExperimentDashboard.tsx"
      - "frontend/src/experiment-dashboard.css"
      - "frontend/src/experiments.ts"
      - "frontend/src/main.tsx"
      - "frontend/scripts/phase9-experiment-dashboard-proof.mjs"
      - ".github/workflows/phase9-experiment-dashboard.yml"

jobs:
  experiment-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend test runtime
        run: python -m pip install -e 'backend[dev]'

      - name: Backend lint and typing
        run: |
          ruff check \
            backend/app/observability/api.py \
            backend/app/observability/experiments.py \
            backend/tests/test_phase9_experiment_dashboard.py
          mypy --config-file backend/pyproject.toml backend/app

      - name: Verify persisted experiment projection
        run: pytest backend/tests/test_phase9_experiment_dashboard.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: TypeScript production build and proof syntax
        working-directory: frontend
        run: |
          npm run build
          node --check scripts/phase9-experiment-dashboard-proof.mjs

      - name: Install Chromium runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend development server
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run dev -- --port 5173 > /tmp/opssentinel-phase9-experiments-vite.log 2>&1 &
          echo $! > /tmp/opssentinel-phase9-experiments-vite.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/?experiments=1 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/opssentinel-phase9-experiments-vite.log
            exit 1
          fi

      - name: Verify experiment dashboard browser states
        working-directory: frontend
        run: node scripts/phase9-experiment-dashboard-proof.mjs

      - name: Retain experiment dashboard proof
        uses: actions/upload-artifact@v4
        with:
          name: phase9-experiment-dashboard-browser
          path: frontend/phase9-experiment-dashboard-browser.json
          if-no-files-found: error
          retention-days: 14

      - name: Frontend diagnostics
        if: failure()
        run: cat /tmp/opssentinel-phase9-experiments-vite.log || true

      - name: Stop frontend development server
        if: always()
        run: |
          if [ -f /tmp/opssentinel-phase9-experiments-vite.pid ]; then
            kill "$(cat /tmp/opssentinel-phase9-experiments-vite.pid)" || true
          fi
