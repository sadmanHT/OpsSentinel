name: Generate dependency locks

on:
  push:
    branches: [repo-hardening]
    paths:
      - frontend/package.json
      - backend/pyproject.toml
      - .github/workflows/repro-locks.yml

permissions:
  contents: write

jobs:
  locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Python lockfile
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --extra dev --output-file backend/requirements.lock backend/pyproject.toml
      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/package-lock.json backend/requirements.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build: lock frontend and backend dependencies"
          git push origin HEAD:repo-hardening
