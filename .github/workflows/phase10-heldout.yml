name: Phase 10 Final Held-Out Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-10-final-validation-release]

jobs:
  heldout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            benchmarklab/pyproject.toml
            evaluationlab/pyproject.toml
      - name: Install benchmark and evaluation runtimes
        run: python -m pip install -e 'benchmarklab[dev]' -e 'evaluationlab[dev]'
      - name: Verify frozen benchmark before execution
        run: python scripts/phase10-freeze-verify.py
      - name: Static checks for held-out tooling
        run: |
          ruff check benchmarklab scripts/phase10-heldout-evaluation.py
          mypy benchmarklab/benchmarklab
          pytest benchmarklab/tests/test_phase10_release_freeze.py benchmarklab/tests/test_phase10_final_report.py
          bash -n scripts/phase10-heldout-local.sh
          make -n phase10-freeze >/dev/null
          make -n phase10-heldout >/dev/null
      - name: Start clean final-evaluation stack
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose build
          docker compose up -d
      - name: Wait for full-stack health
        run: |
          set -euo pipefail
          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
      - name: Execute untouched hidden-test split
        env:
          PHASE10_HELDOUT_OUTPUT_DIR: phase10-heldout
        run: python scripts/phase10-heldout-evaluation.py
      - name: Verify restoration and inspect critical logs
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
          docker compose logs backend --no-color > /tmp/phase10-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway --no-color \
            > /tmp/phase10-chaoslab.log
          if grep -E 'Traceback|Unhandled exception|CRITICAL' /tmp/phase10-backend.log; then
            cat /tmp/phase10-backend.log
            exit 1
          fi
          if grep -E 'Traceback|Unhandled exception|CRITICAL' /tmp/phase10-chaoslab.log; then
            cat /tmp/phase10-chaoslab.log
            exit 1
          fi
      - name: Upload final held-out research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-heldout-evaluation
          path: phase10-heldout
          if-no-files-found: warn
          retention-days: 90
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down final-evaluation stack
        if: always()
        run: docker compose down -v --remove-orphans || true
