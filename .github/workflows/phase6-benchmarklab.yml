name: Phase 6 BenchmarkLab

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-6-benchmarklab-current]

jobs:
  benchmarklab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: benchmarklab/pyproject.toml
      - name: Install BenchmarkLab
        run: python -m pip install -e 'benchmarklab[dev]'
      - name: Ruff
        run: ruff check benchmarklab
      - name: Mypy
        run: mypy benchmarklab/benchmarklab
      - name: Unit and integrity tests
        run: pytest benchmarklab/tests
      - name: Catalog smoke
        working-directory: benchmarklab
        run: |
          python - <<'PY'
          from collections import Counter
          from benchmarklab import load_catalog
          from benchmarklab.models import Difficulty

          catalog = load_catalog()
          assert len(catalog.scenarios) == 50
          assert Counter(item.difficulty for item in catalog.scenarios) == {
              Difficulty.EASY: 10,
              Difficulty.MEDIUM: 12,
              Difficulty.HARD: 12,
              Difficulty.ADVERSARIAL: 8,
              Difficulty.COMPOUND: 8,
          }
          print(catalog.benchmark_version, len(catalog.scenarios))
          PY
