name: Phase 8 Compound Handling

on:
  push:
    branches:
      - phase-8-controlled-research
  pull_request:
    paths:
      - "backend/app/agent/**"
      - "backend/app/config.py"
      - "backend/tests/test_agent_compound.py"
      - "benchmarklab/**"
      - "evaluationlab/**"
      - "researchlab/**"
      - "scripts/phase8-compound-handling-*.py"
      - "docker-compose.yml"
      - ".github/workflows/phase8-compound-handling.yml"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install H5 engineering runtimes
        run: |
          python -m pip install -e 'backend[dev]'
          python -m pip install -e 'benchmarklab[dev]'
          python -m pip install -e 'evaluationlab[dev]'
          python -m pip install -e 'researchlab[dev]'

      - name: Ruff H5 implementation
        run: |
          ruff check \
            backend/app/agent/compound.py \
            backend/app/agent/service.py \
            backend/app/agent/api.py \
            backend/app/config.py \
            backend/tests/test_agent_compound.py \
            researchlab/researchlab/live_executor.py \
            researchlab/researchlab/plans.py \
            researchlab/researchlab/compound_handling.py \
            researchlab/tests/test_plans.py \
            researchlab/tests/test_live_executor.py \
            researchlab/tests/test_compound_handling.py \
            scripts/phase8-compound-handling-arm.py \
            scripts/phase8-compound-handling-report.py

      - name: Strict backend typing
        working-directory: backend
        run: mypy app

      - name: Strict ResearchLab typing
        run: mypy --config-file researchlab/pyproject.toml researchlab/researchlab

      - name: H5 unit and isolation tests
        run: |
          pytest backend/tests/test_agent_compound.py
          pytest researchlab/tests/test_plans.py \
            researchlab/tests/test_live_executor.py \
            researchlab/tests/test_compound_handling.py

  compound-arm:
    needs: integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stopping_strategy:
          - confidence_threshold
          - unresolved_evidence
    env:
      OPSSENTINEL_AGENT_ARCHITECTURE: explicit_planner
      OPSSENTINEL_TEMPORAL_REASONING: standard
      OPSSENTINEL_TOOL_ORDER: free
      OPSSENTINEL_TOOL_ORDER_CONTROLLED: "false"
      OPSSENTINEL_EVIDENCE_MODE: passive_only
      OPSSENTINEL_STOPPING_STRATEGY: ${{ matrix.stopping_strategy }}
      OPSSENTINEL_COMPOUND_EVIDENCE_PLAN: "true"
      OPSSENTINEL_DATABASE_URL: postgresql+psycopg://opssentinel:opssentinel@127.0.0.1:5432/opssentinel
      PHASE8_STOPPING_STRATEGY: ${{ matrix.stopping_strategy }}
      PHASE8_COMPOUND_ARM_OUTPUT: phase8-compound-${{ matrix.stopping_strategy }}.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install live research runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e evaluationlab
          python -m pip install -e 'researchlab[dev]'

      - name: Start clean H5 treatment stack
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans || true
          docker compose up -d --build \
            postgres redis backend chaoslab-controller \
            checkout inventory payment worker gateway

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/agent/health >/tmp/h5-health.json \
              && curl --fail --silent http://127.0.0.1:8100/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8101/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8102/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8103/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8104/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          health = json.loads(Path('/tmp/h5-health.json').read_text())
          expected = os.environ['OPSSENTINEL_STOPPING_STRATEGY']
          assert health['stopping_strategy'] == expected, (health, expected)
          assert health['compound_evidence_plan'] is True, health
          assert health['evidence_mode'] == 'passive_only', health
          assert health['tool_order'] == 'free', health
          assert health['tool_order_controlled'] is False, health
          assert health['temporal_reasoning'] == 'standard', health
          assert 'compound-evidence-plan-v1' in health['provider'], health
          unresolved = 'unresolved-evidence-stop-v1'
          assert (unresolved in health['provider']) is (expected == 'unresolved_evidence')
          assert 'active-verification-v1' not in health['provider'], health
          assert 'tool-order-controlled-v1' not in health['provider'], health
          assert 'temporal-cause-effect-v1' not in health['provider'], health
          PY

      - name: Execute eight-scenario H5 treatment arm
        run: python scripts/phase8-compound-handling-arm.py

      - name: Retain H5 raw trajectories
        uses: actions/upload-artifact@v4
        with:
          name: phase8-compound-${{ matrix.stopping_strategy }}
          path: phase8-compound-${{ matrix.stopping_strategy }}.json
          if-no-files-found: error

      - name: Verify clean restoration and logs
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8100/faults | grep '^\[\]$'
          docker compose logs backend --no-color > /tmp/opssentinel-h5-backend.log
          docker compose logs chaoslab-controller checkout inventory payment worker gateway \
            --no-color > /tmp/opssentinel-h5-chaoslab.log
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-h5-backend.log; then
            echo "Unexpected critical backend log output detected"
            exit 1
          fi
          if grep -E "Traceback|Unhandled exception|CRITICAL" /tmp/opssentinel-h5-chaoslab.log; then
            echo "Unexpected critical ChaosLab log output detected"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

  compound-report:
    needs: compound-arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install reporting runtimes
        run: |
          python -m pip install -e benchmarklab
          python -m pip install -e evaluationlab
          python -m pip install -e researchlab

      - name: Download H5 arms
        uses: actions/download-artifact@v4
        with:
          pattern: phase8-compound-*
          path: phase8-compound-arms
          merge-multiple: true

      - name: Build descriptive H5 report
        env:
          PHASE8_COMPOUND_STANDARD_INPUT: phase8-compound-arms/phase8-compound-confidence_threshold.json
          PHASE8_COMPOUND_UNRESOLVED_INPUT: phase8-compound-arms/phase8-compound-unresolved_evidence.json
          PHASE8_COMPOUND_REPORT_OUTPUT: phase8-compound-handling-report.json
        run: python scripts/phase8-compound-handling-report.py

      - name: Retain complete H5 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase8-compound-handling-report
          path: |
            phase8-compound-handling-report.json
            phase8-compound-arms/*.json
          if-no-files-found: error
